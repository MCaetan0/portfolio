<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Marcelo Caetano de Lima, full-stack software engineer."
    />
    <meta property="og:title" content="Marcelo Caetano de Lima — Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Marcelo Caetano de Lima, full-stack software engineer. Projects, experience, and contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="theme-color" content="#f3eee4" />
    <title>Marcelo Caetano de Lima — Full-Stack Software Engineer</title>
    <script>
      ;(function () {
        try {
          var key = 'portfolio-theme'
          var saved = localStorage.getItem(key)
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
